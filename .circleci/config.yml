jobs:
  wire_WEB-653:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Pivot result stream
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; seq 1 1449998 | sha256sum > /tmp/_bld/21.data; true
            size=$(wc -c </tmp/_bld/21.data); echo "stage ok: WEB-653 size=${size}"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - 21.data
  WEB-653:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Inherit stage
          command: |
            { od -An -c /tmp/_bld/21.data 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Retrieve repository
          command: git clone --depth 3 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xz -dc main-pkg.tar.xz | tar xf -
